name: OG Tools Engine Test
on:
  push:
  workflow_dispatch:
  pull_request:
jobs:
  unit:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install --upgrade pillow
      - name: Install FFmpeg on Ubuntu
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core
      - name: Install FFmpeg on Windows
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - name: Python core and media tests
        run: python -m unittest discover -s tests -v
      - name: Check manifest JSON
        run: python -c "import json; json.load(open('plugin/manifest.json'))"
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check plugin/main.js
      - run: node --check plugin/native/keyframes.js
      - run: node --check plugin/native/ui.js
      - run: node --check plugin/native/selection.js
      - run: node --test tests/test_native_keyframes.js tests/test_selected_clip.js
